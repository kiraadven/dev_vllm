# Prefill rank LMCache config.
#
# Role: sender. KV stays in GPU until written out, then is shipped over
# NIXL/RDMA to the decode node's DRAM pool. No local CPU pool on prefill.

local_cpu: False
max_local_cpu_size: 0
max_local_disk_size: 0
remote_serde: NULL

enable_nixl: True
nixl_role: "sender"
nixl_peer_host: "localhost"        # override per deployment
nixl_peer_port: 55555
nixl_buffer_size: 10737418240      # 10 GB send staging
nixl_buffer_device: "cuda"
nixl_enable_gc: True
